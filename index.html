<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Drycleaners | Pro Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mesh-light {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210,100%,96%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(220,100%,96%,1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(200,100%,96%,1) 0, transparent 50%);
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .progress-ring__circle { transition: stroke-dashoffset 1s ease-in-out; transform: rotate(-90deg); transform-origin: 50% 50%; }
    </style>
</head>
<body class="mesh-light text-slate-900 min-h-screen overflow-x-hidden">

    <nav class="fixed w-full z-50 top-0 left-0 bg-white/70 backdrop-blur-md border-b border-white/50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/30">A1</div>
                <div>
                    <div class="text-lg font-extrabold tracking-tight text-slate-900">A1 Drycleaners</div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Shop Manager v2.1</div>
                </div>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-xs">A</div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pt-32 pb-20 grid lg:grid-cols-2 gap-16 items-start">
        
        <div class="flex flex-col items-start z-10">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-6 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Shop is Open
            </div>

            <h1 class="text-5xl lg:text-6xl font-extrabold tracking-tight text-slate-900 mb-6 leading-[1.1]">
                Manage your <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">daily business.</span>
            </h1>

            <div class="w-full bg-white p-2 rounded-[2rem] shadow-2xl shadow-slate-200/50 ring-1 ring-slate-100">
                
                <div class="flex p-1 bg-slate-50 rounded-xl mb-4">
                    <button onclick="switchTab('bill')" id="tabBill" class="flex-1 py-3 rounded-lg text-sm font-bold transition bg-white text-slate-900 shadow-sm">🧾 New Bill</button>
                    <button onclick="switchTab('add')" id="tabAdd" class="flex-1 py-3 rounded-lg text-sm font-bold transition text-slate-400 hover:text-slate-600">👤 Add Customer</button>
                </div>

                <div id="formBill" class="p-4 space-y-4">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
                        <input id="customerSearch" onkeyup="filterCustomers()" placeholder="Search Customer..." class="w-full pl-10 p-4 bg-slate-50 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                    
                    <div id="customerList" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar h-12">
                        <span class="text-xs font-bold text-slate-400 self-center">Start typing to find customers...</span>
                    </div>
                    <input type="hidden" id="selectedCustomerId">

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Total (₹)</label>
                            <input id="total" type="number" placeholder="0" class="w-full p-4 bg-slate-50 rounded-xl font-extrabold text-xl outline-none focus:ring-2 focus:ring-blue-100">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Paid (₹)</label>
                            <input id="paid" type="number" placeholder="0" class="w-full p-4 bg-slate-50 rounded-xl font-extrabold text-xl text-green-600 outline-none focus:ring-2 focus:ring-green-100">
                        </div>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button onclick="processBill('save')" class="flex-1 bg-slate-900 text-white h-14 rounded-xl font-bold hover:bg-slate-800 transition shadow-lg shadow-slate-300/50 text-sm">
                            Save Only
                        </button>
                        <button onclick="processBill('send')" class="flex-1 bg-green-600 text-white h-14 rounded-xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-500/30 text-sm flex items-center justify-center gap-2">
                            <span>WhatsApp</span> <i class="fa-brands fa-whatsapp text-lg"></i>
                        </button>
                    </div>
                </div>

                <div id="formAdd" class="hidden p-4 space-y-4">
                    <input id="nameEnglish" placeholder="Full Name (English)" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-100">
                    <input id="nameMarathi" placeholder="नाव (Marathi - Optional)" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-100">
                    <input id="mobile" type="number" placeholder="Mobile Number" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-100">
                    
                    <button onclick="saveCustomer()" class="w-full bg-blue-600 text-white h-14 rounded-xl font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30">
                        <span>Save Customer</span>
                    </button>
                </div>

            </div>
        </div>

        <div class="relative lg:h-[600px] flex items-center justify-center">
            <div class="animate-float w-full max-w-md bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl ring-1 ring-white/60 p-8 z-20">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <span class="text-[10px] font-bold uppercase tracking-wider bg-green-100 text-green-700 px-3 py-1 rounded-full">Live Stats</span>
                        <h3 class="text-2xl font-bold text-slate-900 mt-2">Revenue Report</h3>
                    </div>
                </div>

                <div class="flex flex-col items-center mb-8">
                    <div class="relative w-48 h-48">
                        <svg class="w-full h-full transform -rotate-90">
                            <circle cx="96" cy="96" r="88" stroke="#f1f5f9" stroke-width="12" fill="none"></circle>
                            <circle id="revenueCircle" class="progress-ring__circle" cx="96" cy="96" r="88" stroke="#3b82f6" stroke-width="12" fill="none" stroke-dasharray="552" stroke-dashoffset="552" stroke-linecap="round"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span id="statTotal" class="text-4xl font-extrabold text-slate-900 tracking-tight">₹0</span>
                            <span class="text-xs font-bold text-slate-400 uppercase mt-1">Total Sales</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-red-50 rounded-2xl p-5 border border-red-100">
                        <div class="text-red-400 text-xs font-bold uppercase mb-1">Pending Due</div>
                        <div id="statDue" class="text-2xl font-extrabold text-red-600">₹0</div>
                    </div>
                    <div class="bg-green-50 rounded-2xl p-5 border border-green-100">
                        <div class="text-green-500 text-xs font-bold uppercase mb-1">Recovered</div>
                        <div id="statPaid" class="text-2xl font-extrabold text-green-600">₹0</div>
                    </div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-3 ml-1">Recent Activity</h4>
                    <div id="historyList" class="space-y-2 max-h-40 overflow-y-auto pr-2">
                        <p class="text-xs text-slate-400 italic pl-1">Loading...</p>
                    </div>
                </div>
            </div>
            
            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
        </div>

    </main>

    <script>
        let allCustomers = [];
        let selectedCustomer = null;

        function switchTab(tab) {
            if(tab === 'bill') {
                document.getElementById('formBill').classList.remove('hidden');
                document.getElementById('formAdd').classList.add('hidden');
                document.getElementById('tabBill').classList.replace('text-slate-400', 'bg-white');
                document.getElementById('tabBill').classList.add('text-slate-900', 'shadow-sm');
                document.getElementById('tabAdd').classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
                document.getElementById('tabAdd').classList.add('text-slate-400');
            } else {
                document.getElementById('formBill').classList.add('hidden');
                document.getElementById('formAdd').classList.remove('hidden');
                document.getElementById('tabAdd').classList.replace('text-slate-400', 'bg-white');
                document.getElementById('tabAdd').classList.add('text-slate-900', 'shadow-sm');
                document.getElementById('tabBill').classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
                document.getElementById('tabBill').classList.add('text-slate-400');
            }
        }

        async function init() {
            const cRes = await fetch('/customers');
            allCustomers = await cRes.json();
            loadStats();
        }

        async function loadStats() {
            const bRes = await fetch('/bills');
            const bills = await bRes.json();
            
            let total = 0, paid = 0, due = 0;
            let historyHTML = '';

            bills.forEach((b, i) => {
                total += b.total;
                paid += b.paid;
                due += b.due;

                if(i < 5) {
                    historyHTML += `
                    <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500 text-xs">${b.customerName.charAt(0)}</div>
                            <div>
                                <div class="text-xs font-bold text-slate-900">${b.customerName}</div>
                                <div class="text-[10px] text-slate-400">${b.date.split(',')[0]}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-bold text-slate-900">₹${b.total}</div>
                            ${b.due > 0 ? `<div class="text-[10px] font-bold text-red-500">Due: ${b.due}</div>` : `<div class="text-[10px] font-bold text-green-500">Paid</div>`}
                        </div>
                    </div>`;
                }
            });

            document.getElementById('statTotal').innerText = `₹${total}`;
            document.getElementById('statPaid').innerText = `₹${paid}`;
            document.getElementById('statDue').innerText = `₹${due}`;
            document.getElementById('historyList').innerHTML = historyHTML;

            const paidPercentage = total > 0 ? (paid / total) : 0;
            const offset = 552 - (paidPercentage * 552);
            document.getElementById('revenueCircle').style.strokeDashoffset = offset;
        }

        function filterCustomers() {
            const query = document.getElementById('customerSearch').value.toLowerCase();
            const list = document.getElementById('customerList');
            
            if(query.length < 1) {
                list.innerHTML = '<span class="text-xs font-bold text-slate-400 self-center">Start typing...</span>';
                return;
            }

            const matches = allCustomers.filter(c => c.english.toLowerCase().includes(query) || c.mobile.includes(query));
            
            list.innerHTML = '';
            matches.slice(0, 5).forEach(c => {
                const div = document.createElement('button');
                div.className = "flex-shrink-0 px-4 py-2 bg-blue-50 text-blue-700 rounded-full text-xs font-bold border border-blue-100 hover:bg-blue-100 transition whitespace-nowrap";
                div.innerText = `${c.english}`;
                div.onclick = () => selectCustomer(c);
                list.appendChild(div);
            });
        }

        function selectCustomer(c) {
            selectedCustomer = c;
            document.getElementById('customerSearch').value = c.english;
            document.getElementById('customerList').innerHTML = `<span class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full border border-green-100">Selected: ${c.mobile}</span>`;
        }

        // --- MODIFIED SAVE FUNCTION FOR 2 BUTTONS ---
        function processBill(action) {
            if(!selectedCustomer) return alert("Please select a customer first!");
            const total = Number(document.getElementById('total').value);
            const paid = Number(document.getElementById('paid').value);
            
            if(!total) return alert("Please enter total amount");

            const billData = {
                customerName: selectedCustomer.english,
                customerMobile: selectedCustomer.mobile,
                total: total,
                paid: paid,
                due: total - paid,
                date: new Date().toLocaleString()
            };

            fetch("/bills", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(billData)
            }).then(() => {
                if (action === 'send') {
                    // WhatsApp Logic
                    const msg = `*A1 DRYCLEANERS INVOICE* 🧺\n\nHello ${selectedCustomer.english},\nYour clothes are ready!\n\n💰 Total: ₹${total}\n✅ Paid: ₹${paid}\n❗ Balance: ₹${total - paid}\n\nThank you! 🙏`;
                    window.location.href = `https://wa.me/91${selectedCustomer.mobile}?text=${encodeURIComponent(msg)}`;
                } else {
                    // Save Only Logic
                    alert("Bill Saved Successfully!");
                    // Clear Fields
                    document.getElementById('total').value = "";
                    document.getElementById('paid').value = "";
                    document.getElementById('customerSearch').value = "";
                    document.getElementById('customerList').innerHTML = '<span class="text-xs font-bold text-slate-400 self-center">Start typing...</span>';
                    selectedCustomer = null;
                    // Refresh Dashboard Stats Immediately
                    loadStats();
                }
            });
        }

        function saveCustomer() {
            const customer = {
                english: document.getElementById('nameEnglish').value,
                marathi: document.getElementById('nameMarathi').value,
                mobile: document.getElementById('mobile').value
            };
            if(!customer.english || !customer.mobile) return alert("Name & Mobile required");

            fetch("/customers", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(customer)
            }).then(() => {
                alert("Customer Saved!");
                location.reload();
            });
        }

        init();
    </script>
</body>
</html>
